[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-ice-traverse-planner"
version = "0.1.0"
description = "Lunar south-polar ice characterization and rover traverse planning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1"
]

[tool.setuptools]
package-dir = {"" = "ml"}

[tool.setuptools.packages.find]
where = ["ml"]

[tool.pytest.ini_options]
pythonpath = ["ml", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
